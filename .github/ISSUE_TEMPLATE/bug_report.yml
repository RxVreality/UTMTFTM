name: Something's broken
description: It crashed, it won't start, or a hand ended up somewhere it shouldn't.
title: "[Bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Controller, headset and game
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UTMTFTM version
      description: On Windows it's listed under Settings > Apps. On a Frame, the release you installed.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag in `utmtftm.log`, and `driver.log` if the hands aren't moving at all. They're in `%LOCALAPPDATA%\UTMTFTM` on Windows and `~/.local/share/UTMTFTM` on a Frame.
