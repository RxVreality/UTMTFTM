# Every push gets built and tested. A tag like v0.1.0 also packs a release and leaves it as a draft:
# nothing is public until someone reads it and clicks Publish.
#
# Code signing (README, "Code signing policy"): once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN are set, a tag's Windows files go to SignPath to be signed, and the build waits there until a
# maintainer approves the request on signpath.io. Run this by hand ("Run workflow", test signing ticked) to try the whole
# signing path with SignPath's test certificate, which needs no approval and makes no release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      test_signing:
        description: 'Sign the Windows files with the SignPath test certificate'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The Steam Frame build, built and tested on a real ARM64 machine. 22.04 for its older C library,
  # so the result runs on anything newer.
  frame:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config g++ file libcairo2-dev libfreetype-dev libvulkan-dev mesa-vulkan-drivers

      - name: Build and run the offline tests
        run: sh build.sh

      - name: Pack
        run: |
          v=${GITHUB_SHA:0:7}
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=0.0.0-$v; fi
          sh packaging/linux/make-release.sh "$v"
          cc -O2 -s -o build/release-frame/install-utmtftm packaging/linux/framedrop-launcher.c
          python3 packaging/linux/make-framedrop.py "$v" build/release-frame "$GITHUB_REPOSITORY"
        shell: bash

      - name: Install it and run it against a simulated SteamVR
        run: sh tests/test_frame_run.sh build/release-frame/UTMTFTM-*-linux-arm64.tar.gz build/frame-run

      - uses: actions/upload-artifact@v4
        with:
          name: utmtftm-frame
          path: |
            build/release-frame/*.tar.gz
            build/release-frame/*.sha256
            build/release-frame/*-framedrop.zip
            build/release-frame/utmtftm.framedrop.json
            build/release-frame/install-frame.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-screens
          retention-days: 14
          path: |
            build/ui/*.png
            build/frame-run/

      # Everything needed to run the same tests on a real headset.
      - uses: actions/upload-artifact@v4
        with:
          name: frame-test-kit
          retention-days: 14
          path: |
            dist/
            tests/test_frame_run.sh

  windows:
    needs: frame
    # The private test copy only needs the Frame build, and Windows machines use up its free minutes twice as fast.
    if: github.repository == 'RxVreality/UTMTFTM'
    runs-on: windows-2022
    # Room for a signing request to wait for approval on signpath.io (up to 3 hours each, two per release).
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read  # SignPath reads this run's details and fetches the files to sign
    env:
      # Sign a tag (release certificate, approved by hand) or a hand-started test run (test certificate), and only once
      # SignPath is set up.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (github.ref_type == 'tag' || inputs.test_signing == true) }}
      SIGNING_POLICY: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
    steps:
      - uses: actions/checkout@v4

      # The version every Windows file says in its Details tab, and what the files are called. A tag must match
      # CMakeLists.txt, or the program would think it's a different version from the one it's in.
      - name: Version
        run: |
          $cmake = (Select-String -Path CMakeLists.txt -Pattern 'project\(utmtftm VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($v -ne $cmake) { throw "The tag says $v but CMakeLists.txt says $cmake" }
          } else {
            $v = "0.0.0-$($env:GITHUB_SHA.Substring(0,7))"
          }
          "V=$v" >> $env:GITHUB_ENV
          "UTMTFTM_PRODUCT_VERSION=$v" >> $env:GITHUB_ENV
          "Packing $v; signing: $env:SIGN ($env:SIGNING_POLICY)"

      # cairo takes a long time to build, so keep it between runs.
      - uses: actions/cache@v4
        id: libs
        with:
          path: vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Install libraries
        if: steps.libs.outputs.cache-hit != 'true'
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static'

      - name: Build and run the offline tests
        shell: cmd
        run: build.cmd

      - name: Pack, part 1 (the files we sign)
        run: |
          choco install nsis -y --no-progress
          .\packaging\make-release.ps1 -Version $env:V -Step prepare

      # The program, the driver and the uninstaller go to SignPath first, because the zip and the installer are made from
      # the signed ones.
      - name: Hand the program, driver and uninstaller to SignPath
        if: env.SIGN == 'true'
        id: program-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: to-sign-program
          path: build/release/tosign/
          retention-days: 1

      - name: Sign the program, driver and uninstaller
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'UTMTFTM' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: program
          github-artifact-id: ${{ steps.program-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: build/release/tosign
          parameters: |
            version: ${{ toJSON(env.V) }}

      - name: Pack, part 2 (the zip and the installer)
        run: .\packaging\make-release.ps1 -Version $env:V -Step pack

      - name: Hand the installer to SignPath
        if: env.SIGN == 'true'
        id: installer-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: to-sign-installer
          path: build/release/UTMTFTM-Setup-${{ env.V }}.exe
          retention-days: 1

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'UTMTFTM' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: build/release
          parameters: |
            version: ${{ toJSON(env.V) }}

      # Checksums last, after signing has changed the files. Then: every file says UTMTFTM and this version, the zip and
      # the installer hold exactly the signed files, and a release's signatures are SignPath Foundation's and trusted.
      - name: Checksums and checks
        run: |
          .\packaging\make-release.ps1 -Version $env:V -Step sums
          if ($env:SIGN -ne 'true') { .\packaging\check-release.ps1 -Version $env:V }
          elseif ($env:SIGNING_POLICY -eq 'release-signing') { .\packaging\check-release.ps1 -Version $env:V -Signed -Trusted }
          else { .\packaging\check-release.ps1 -Version $env:V -Signed -Signer '' }

      - uses: actions/upload-artifact@v4
        with:
          name: utmtftm
          path: |
            build/release/UTMTFTM-*.zip
            build/release/UTMTFTM-Setup-*.exe
            build/release/*.sha256

      # The Frame build joins the same draft, so a release always has both or neither.
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: utmtftm-frame
          path: build/release

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build\release -File | Where-Object { $_.Extension -ne '.ico' } | ForEach-Object { $_.FullName }
          $notes = 'packaging\release-notes.md'
          if ($env:SIGN -eq 'true') {
            # SignPath Foundation's terms: the download page names the code signing policy.
            $notes = 'build\release-notes-signed.md'
            $text = (Get-Content packaging\release-notes.md -Raw).TrimEnd()
            $text += "`n`nThe Windows files are signed. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy).`n"
            Set-Content $notes $text -Encoding utf8
          }
          gh release create $env:GITHUB_REF_NAME $files --draft --title "UTMTFTM $($env:GITHUB_REF_NAME)" --notes-file $notes
