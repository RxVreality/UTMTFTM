# Every push gets built and tested. A tag like v0.1.0 also packs a release and leaves it as a draft:
# nothing is public until someone reads it and clicks Publish.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  # The Steam Frame build, built and tested on a real ARM64 machine. 22.04 for its older C library,
  # so the result runs on anything newer.
  frame:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config g++ file libcairo2-dev libfreetype-dev libvulkan-dev mesa-vulkan-drivers

      - name: Build and run the offline tests
        run: sh build.sh

      - name: Pack
        run: |
          v=${GITHUB_SHA:0:7}
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=0.0.0-$v; fi
          sh packaging/linux/make-release.sh "$v"
        shell: bash

      - name: Install it and run it against a simulated SteamVR
        run: sh tests/test_frame_run.sh build/release-frame/UTMTFTM-*-linux-arm64.tar.gz build/frame-run

      - uses: actions/upload-artifact@v4
        with:
          name: utmtftm-frame
          path: |
            build/release-frame/*.tar.gz
            build/release-frame/*.sha256
            build/release-frame/install-frame.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-screens
          retention-days: 14
          path: |
            build/ui/*.png
            build/frame-run/

      # Everything needed to run the same tests on a real headset.
      - uses: actions/upload-artifact@v4
        with:
          name: frame-test-kit
          retention-days: 14
          path: |
            dist/
            tests/test_frame_run.sh

  windows:
    needs: frame
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # cairo takes a long time to build, so keep it between runs.
      - uses: actions/cache@v4
        id: libs
        with:
          path: vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Install libraries
        if: steps.libs.outputs.cache-hit != 'true'
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static'

      - name: Build and run the offline tests
        shell: cmd
        run: build.cmd

      - name: Pack
        run: |
          choco install nsis -y --no-progress
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-$($env:GITHUB_SHA.Substring(0,7))" }
          .\packaging\make-release.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: utmtftm
          path: |
            build/release/UTMTFTM-*.zip
            build/release/UTMTFTM-Setup-*.exe
            build/release/*.sha256

      # The Frame build joins the same draft, so a release always has both or neither.
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: utmtftm-frame
          path: build/release

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build\release -File | Where-Object { $_.Extension -ne '.ico' } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $files --draft --title "UTMTFTM $($env:GITHUB_REF_NAME)" --notes-file packaging\release-notes.md
